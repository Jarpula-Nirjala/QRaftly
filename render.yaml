services:
  - type: web
    name: qraftly
    runtime: node
    plan: free
    # Next to the Neon database (us-east-2, Ohio): every request makes a few database round trips.
    region: ohio
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Required: a Postgres connection string (a free Neon database works). The embedded database is for
      # local development only; it does not fit the free instance and would be lost on every deploy.
      - key: DATABASE_URL
        sync: false
      # The site's public address, used inside every QR code, e.g. https://qraftly.onrender.com (or your own domain).
      # Optional on Render: without it the address Render gives the service (RENDER_EXTERNAL_URL) is used.
      - key: PUBLIC_URL
        sync: false
      # Signs tickets, unlock links and visitor ids. Keep it fixed: changing it invalidates issued tickets.
      - key: HMAC_SECRET
        generateValue: true
      # Optional: "Continue with Google". Create an OAuth client (Web application) in Google Cloud and add the
      # redirect URI <PUBLIC_URL>/api/auth/oauth/google/callback. Without these the button explains it is off.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Optional: emails password reset links through Resend (resend.com). Without it the link goes to the log.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
