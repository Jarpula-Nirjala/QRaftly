<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="QR codes that do more: editable links with scan analytics, smart rules, PIN-protected and single-use codes, event tickets, signed certificates and bulk printing. Built on a QR engine written from scratch." />
    <meta name="theme-color" content="#4338ca" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      try {
        const t = localStorage.getItem('qrf-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>

    <div id="root"></div>

  </body>
