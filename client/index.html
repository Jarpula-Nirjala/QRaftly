<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="QR codes that do more: editable links with scan analytics, smart rules, PIN-protected and single-use codes, event tickets, signed certificates and bulk printing. Built on a QR engine written from scratch." />
    <meta name="theme-color" content="#ffffff" />
    <title>QRForge</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='white'/%3E%3Cpath d='M21 13V8H5v16h16v-5' fill='none' stroke='%230b1530' stroke-width='4'/%3E%3Crect x='9' y='13' width='6' height='6' fill='%230b1530'/%3E%3Crect x='24' y='13' width='6' height='6' fill='%232563eb'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      try {
        const t = localStorage.getItem('qrf-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
